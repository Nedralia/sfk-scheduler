name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    env:
      TF_VAR_mailgun_api_key: ${{ secrets.MAILGUN_API_KEY }}
      TF_VAR_mailgun_domain: ${{ secrets.MAILGUN_DOMAIN }}
      TF_VAR_mwl_token: ${{ secrets.MWL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Set up named AWS profile
        # The Terraform backend and provider are configured to use the
        # "nedralia" named profile, so mirror the CI credentials into it.
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" --profile nedralia
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" --profile nedralia
          aws configure set region eu-north-1 --profile nedralia

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = process.env.PLAN_STDOUT || '';
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... output truncated ...'
              : plan;
            const body = [
              '#### Terraform Plan 📖',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              truncated,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
