name: Build and Deploy Web Page

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/page/**'
  push:
    branches:
      - main
    paths:
      - 'src/page/**'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/page

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/page/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Fetch schedule data
        run: |
          mkdir -p ../../data
          BUCKET="$(echo -n "${{ secrets.SCHEDULE_BUCKET_NAME }}" | tr -d '[:space:]')"
          aws s3 cp "s3://${BUCKET}/schedule.csv" ../../data/schedule.csv

      - name: Build
        run: npm run build

      - name: Deploy to S3 and invalidate CloudFront
        run: npm run deploy -- ${{ secrets.WEBSITE_BUCKET_NAME }} ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
